name: app_template
description: Baseline template for new offline-first App Factory applications.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Core factory packages (included by default)
  factory_core:
    path: ../../packages/factory_core
  factory_ui:
    path: ../../packages/factory_ui
  factory_storage:
    path: ../../packages/factory_storage
  factory_navigation:
    path: ../../packages/factory_navigation

  # Optional factory packages (uncomment as needed):
  # factory_audio:
  #   path: ../../packages/factory_audio
  # factory_ads:
  #   path: ../../packages/factory_ads
  # factory_billing:
  #   path: ../../packages/factory_billing

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
