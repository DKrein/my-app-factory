name: sleep_sounds
description: Offline sleep sounds pilot for App Factory.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.4
dependencies:
  flutter:
    sdk: flutter
  factory_core:
    path: ../../packages/factory_core
  factory_ui:
    path: ../../packages/factory_ui
  factory_audio:
    path: ../../packages/factory_audio
  factory_storage:
    path: ../../packages/factory_storage
  factory_ads:
    path: ../../packages/factory_ads
  factory_billing:
    path: ../../packages/factory_billing
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4
flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/branding/icon_foreground.png

flutter_launcher_icons:
  android: "launcher_icon"
  min_sdk_android: 21
  image_path: "assets/branding/icon_legacy.png"
  adaptive_icon_background: "assets/branding/icon_background.png"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/icon_monochrome.png"

flutter_native_splash:
  color: "0B1020"
  android_12:
    color: "0B1020"
